[project]
name = "di-eval"
version = "0.1.0"
description = "Document Intelligence evaluation harness: field scoring, summary evaluation, slice breakdowns"
requires-python = ">=3.12,<3.13"
dependencies = [
  "data-model",
  "di-core",
  "ai-core",
]

[tool.uv.sources]
data-model = { workspace = true }
di-core = { workspace = true }
ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/di_eval"]
