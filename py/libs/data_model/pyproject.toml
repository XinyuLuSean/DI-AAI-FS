[project]
name = "data-model"
version = "0.1.0"
description = "Shared Pydantic schemas and domain models for the DI-AAI-FS playground"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_model"]
