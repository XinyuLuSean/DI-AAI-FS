[project]
name = "ai-core"
version = "0.1.0"
description = "Applied AI core: LLM adapter, prompt registry, structured generation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "data-model",
  "litellm>=1.0",
  "httpx>=0.28",
]

[tool.uv.sources]
data-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_core"]
