[project]
name = "di-core"
version = "0.1.0"
description = "Document Intelligence core: parsing, chunking, normalization"
requires-python = ">=3.12,<3.13"
dependencies = [
  "data-model",
  "pymupdf>=1.25",
]

[tool.uv.sources]
data-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/di_core"]
