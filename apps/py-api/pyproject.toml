[project]
name = "py-api"
version = "0.1.0"
description = "FastAPI service for DI-AAI-FS — document ingestion, extraction, AI tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.12",
  "pydantic-settings>=2.0",
  "structlog>=24.0",
  "data-model",
  "di-core",
  "ai-core",
  "storage",
]

[tool.uv.sources]
data-model = { workspace = true }
di-core = { workspace = true }
ai-core = { workspace = true }
storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_api"]
